services:
  postgres:
    image: postgres:16-alpine
    container_name: resume-generator-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: resume
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: resume_generator
    ports:
      - "5432:5432"
    volumes:
      - resume_pg_data:/var/lib/postgresql/data

volumes:
  resume_pg_data:
